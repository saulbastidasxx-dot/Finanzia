name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  validate-android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate missing Android/Web runners
        run: ./tool/bootstrap_platforms.sh android,web
      - name: Enable Android core library desugaring
        run: |
          FILE="android/app/build.gradle.kts"

          python3 - <<'PYTHON'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in s:
              marker = "    compileOptions {"
              s = s.replace(
                  marker,
                  marker + "\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )

          dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

          if "coreLibraryDesugaring(" not in s:
              marker = "dependencies {"
              if marker in s:
                  s = s.replace(marker, marker + "\n" + dep, 1)
              else:
                  s += "\n\ndependencies {\n" + dep + "\n}\n"

          p.write_text(s)
          PYTHON

          echo "=== Android desugaring ==="
          grep -n "isCoreLibraryDesugaringEnabled\|coreLibraryDesugaring" "$FILE"

      - run: flutter pub get
      - name: Format Dart
        run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - run: flutter build web --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - run: flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: finanzia-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  validate-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing iOS runner
        run: ./tool/bootstrap_platforms.sh ios
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - run: flutter build ios --release --no-codesign --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
