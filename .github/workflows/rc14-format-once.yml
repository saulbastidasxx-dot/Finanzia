name: RC14 - aplicar formato Dart una sola vez

on:
  push:
    branches: [principal]
    paths:
      - '.github/workflows/rc14-format-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-rc14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Aplicar dart format
        run: dart format lib test

      - name: Verificar que el código quedó formateado
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Retirar este workflow temporal
        run: rm -f .github/workflows/rc14-format-once.yml

      - name: Guardar únicamente el formato de RC14
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/rc14-format-once.yml
          if git diff --cached --quiet; then
            echo "No hay cambios de formato pendientes."
            exit 0
          fi
          git commit -m "RC14: aplicar formato Dart requerido por CI"
          git push origin HEAD:principal
